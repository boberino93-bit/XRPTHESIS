name: XRP Thesis Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: write

concurrency:
  group: xrp-thesis-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run research-state tests
        run: python -m unittest discover -s tests -v

      - name: Validate committed research state
        run: python scripts/score_thesis.py --check

      - name: Collect public metrics
        run: python scripts/collect_public_metrics.py

      - name: Recompute thesis score
        run: python scripts/score_thesis.py

      - name: Commit monitoring snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xrp-thesis-monitor[bot]"
          git config user.email "xrp-thesis-monitor[bot]@users.noreply.github.com"
          git add data/snapshots reports/latest-score.md
          if git diff --cached --quiet; then
            echo "No monitoring changes to commit."
            exit 0
          fi
          git commit -m "chore: weekly XRP thesis telemetry"
          git pull --rebase origin main
          git push origin HEAD:main
