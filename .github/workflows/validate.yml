name: Validate XRPTHESIS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate research data
        run: python scripts/validate_data.py

      - name: Rebuild deterministic score report
        run: python scripts/score_thesis.py

      - name: Require committed score report to match ledger
        run: git diff --exit-code -- reports/latest-score.md
