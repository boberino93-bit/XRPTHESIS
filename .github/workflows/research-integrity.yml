name: Research Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate research ledgers
        run: python scripts/validate_research_data.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Recompute deterministic thesis report
        run: python scripts/score_thesis.py

      - name: Verify committed report matches ledger
        run: git diff --exit-code -- reports/latest-score.md
